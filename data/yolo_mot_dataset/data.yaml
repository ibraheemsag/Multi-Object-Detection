path: ../data/yolo_mot_dataset
#path: /content/data/yolo_mot_dataset
train: images/train
val: images/val

nc: 12
names: ['pedestrian', 'person_on_vehicle', 'car', 'bicycle', 'motorbike', 
        'non_motorized_vehicle', 'static_person', 'distractor', 'occluder', 
        'occluder_on_ground', 'occluder_full', 'reflection']
task: detect
epochs: 100
imgsz: 640
batch: 16  
patience: 4
save: true
cache: true          
pretrained: true
seed: 42
rect: true  
multi_scale: true       
cos_lr: true
amp: true             
mosaic: 0.7                      
mixup: 0.1                      
perspective: 0.0                 
hsv_h: 0.015                     
hsv_s: 0.5                       
hsv_v: 0.3                      
translate: 0.1                  
scale: 0.4                      
flipud: 0.0                      
fliplr: 0.5   